<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DMU IT Hub - Registration</title>
    <!-- Google Fonts & FontAwesome Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
            color: #f8fafc;
        }

        .register-container {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 620px;
            padding: 40px;
            position: relative;
            overflow: hidden;
        }

        .register-container::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(59,130,246,0.15) 0%, transparent 60%);
            pointer-events: none;
        }

        .header-section {
            text-align: center;
            margin-bottom: 30px;
            position: relative;
            z-index: 1;
        }

        .logo-icon {
            width: 65px;
            height: 65px;
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            border-radius: 20px;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            font-size: 30px;
            color: #ffffff;
            margin-bottom: 12px;
            box-shadow: 0 10px 20px rgba(37, 99, 235, 0.3);
        }

        .header-section h2 {
            font-size: 26px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 6px;
        }

        .header-section p {
            color: #94a3b8;
            font-size: 13px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            position: relative;
            z-index: 1;
        }

        .full-width {
            grid-column: span 2;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .input-group label {
            font-size: 13px;
            font-weight: 500;
            color: #cbd5e1;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper i {
            position: absolute;
            left: 14px;
            color: #64748b;
            font-size: 15px;
            transition: color 0.3s ease;
        }

        .input-wrapper input, 
        .input-wrapper select {
            width: 100%;
            padding: 12px 14px 12px 42px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: #f8fafc;
            font-size: 14px;
            outline: none;
            transition: all 0.3s ease;
        }

        .input-wrapper select {
            cursor: pointer;
        }

        .input-wrapper input:focus, 
        .input-wrapper select:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.15);
            background: rgba(15, 23, 42, 0.8);
        }

        .input-wrapper input:focus + i,
        .input-wrapper select:focus + i {
            color: #3b82f6;
        }

        /* Custom Radio Buttons for User Role */
        .role-cards {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 4px;
        }

        .role-option input[type="radio"] {
            display: none;
        }

        .role-card {
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(15, 23, 42, 0.6);
            padding: 12px;
            border-radius: 12px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            color: #94a3b8;
            font-size: 14px;
        }

        .role-option input[type="radio"]:checked + .role-card {
            border-color: #3b82f6;
            background: rgba(59, 130, 246, 0.2);
            color: #3b82f6;
            font-weight: 600;
        }

        /* Action Button */
        .btn-submit {
            margin-top: 25px;
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            color: #ffffff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 20px rgba(37, 99, 235, 0.3);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            position: relative;
            z-index: 1;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(37, 99, 235, 0.4);
            background: linear-gradient(135deg, #1d4ed8 0%, #1e40af 100%);
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #94a3b8;
            position: relative;
            z-index: 1;
        }

        .login-link a {
            color: #3b82f6;
            text-decoration: none;
            font-weight: 600;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        @media (max-width: 640px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
            .full-width {
                grid-column: span 1;
            }
            .register-container {
                padding: 25px 20px;
            }
        }
    </style>
</head>
<body>

    <div class="register-container">
        
        <!-- Header -->
        <div class="header-section">
            <div class="logo-icon">
                <i class="fa-solid fa-laptop-code"></i>
            </div>
            <h2>DMU IT Hub Account Creation</h2>
            <p>እባክዎን የመመዝገቢያ መረጃዎን በትክክል ያስገቡ</p>
        </div>

        <!-- Registration Form -->
        <form action="register_process.php" method="POST">
            <div class="form-grid">
                
                <!-- Account Role Selection -->
                <div class="input-group full-width">
                    <label>የአካውንት ዓይነት (Account Type)</label>
                    <div class="role-cards">
                        <label class="role-option">
                            <input type="radio" name="role" value="student" id="role-student" checked onclick="toggleStudentFields(true)">
                            <div class="role-card">
                                <i class="fa-solid fa-graduation-cap"></i>
                                <span>DMU IT Student</span>
                            </div>
                        </label>
                        <label class="role-option">
                            <input type="radio" name="role" value="guest" id="role-guest" onclick="toggleStudentFields(false)">
                            <div class="role-card">
                                <i class="fa-solid fa-user-tie"></i>
                                <span>Non-Student / Guest</span>
                            </div>
                        </label>
                    </div>
                </div>

                <!-- Full Name -->
                <div class="input-group full-width">
                    <label for="fullname">ሙሉ ስም (Full Name)</label>
                    <div class="input-wrapper">
                        <input type="text" id="fullname" name="fullname" placeholder="አበበ በቀለ" required>
                        <i class="fa-solid fa-user"></i>
                    </div>
                </div>

                <!-- Email -->
                <div class="input-group">
                    <label for="email">ኢሜይል (Email)</label>
                    <div class="input-wrapper">
                        <input type="email" id="email" name="email" placeholder="example@gmail.com" required>
                        <i class="fa-solid fa-envelope"></i>
                    </div>
                </div>

                <!-- Phone Number -->
                <div class="input-group">
                    <label for="phone">ስልክ ቁጥር (Phone)</label>
                    <div class="input-wrapper">
                        <input type="tel" id="phone" name="phone" placeholder="0911223344" required>
                        <i class="fa-solid fa-phone"></i>
                    </div>
                </div>

                <!-- Dynamic Student Fields Container -->
                <!-- Student ID (For DMU Students Only) -->
                <div class="input-group student-field">
                    <label for="student_id">Student ID</label>
                    <div class="input-wrapper">
                        <input type="text" id="student_id" name="student_id" placeholder="BDU1234567 or Ter/...">
                        <i class="fa-solid fa-id-card"></i>
                    </div>
                </div>

                <!-- Batch / Year (For DMU Students Only) -->
                <div class="input-group student-field">
                    <label for="batch">የትምህርት ዘመን (Year)</label>
                    <div class="input-wrapper">
                        <select id="batch" name="batch">
                            <option value="1st Year">1st Year</option>
                            <option value="2nd Year">2nd Year</option>
                            <option value="3rd Year">3rd Year</option>
                            <option value="4th Year">4th Year</option>
                        </select>
                        <i class="fa-solid fa-layer-group"></i>
                    </div>
                </div>

                <!-- GitHub Profile Link -->
                <div class="input-group full-width student-field">
                    <label for="github">GitHub Profile Link</label>
                    <div class="input-wrapper">
                        <input type="url" id="github" name="github" placeholder="https://github.com/username">
                        <i class="fa-brands fa-github"></i>
                    </div>
                </div>

                <!-- Skills -->
                <div class="input-group full-width student-field">
                    <label for="skills">ክህሎቶች (Skills - በኮማ ይለዩ)</label>
                    <div class="input-wrapper">
                        <input type="text" id="skills" name="skills" placeholder="PHP, MySQL, HTML, CSS, JavaScript">
                        <i class="fa-solid fa-code"></i>
                    </div>
                </div>

                <!-- Password -->
                <div class="input-group">
                    <label for="password">የይለፍ ቃል (Password)</label>
                    <div class="input-wrapper">
                        <input type="password" id="password" name="password" placeholder="••••••••" required>
                        <i class="fa-solid fa-lock"></i>
                    </div>
                </div>

                <!-- Confirm Password -->
                <div class="input-group">
                    <label for="confirm_password">ድጋሚ ያረጋግጡ</label>
                    <div class="input-wrapper">
                        <input type="password" id="confirm_password" name="confirm_password" placeholder="••••••••" required>
                        <i class="fa-solid fa-shield-halved"></i>
                    </div>
                </div>

            </div>

            <!-- Submit Button -->
            <button type="submit" class="btn-submit">
                <span>ተመዝገብ (Register)</span>
                <i class="fa-solid fa-arrow-right"></i>
            </button>

            <!-- Login Link -->
            <div class="login-link">
                አካውንት አለዎት? <a href="login.html">እዚህ ይግቡ (Login)</a>
            </div>
        </form>

    </div>

    <!-- JavaScript to Dynamic Toggle Fields -->
    <script>
        function toggleStudentFields(isStudent) {
            const studentFields = document.querySelectorAll('.student-field');
            
            studentFields.forEach(field => {
                if (isStudent) {
                    field.style.display = 'flex';
                } else {
                    field.style.display = 'none';
                }
            });
        }

        // Initialize state on page load
        document.addEventListener("DOMContentLoaded", function() {
            const isStudentChecked = document.getElementById('role-student').checked;
            toggleStudentFields(isStudentChecked);
        });
    </script>
</body>
</html>
